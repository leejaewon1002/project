<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Fit | 메뉴추천</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon">🥬</span><span>Meal Fit</span></a>
    <nav class="nav">
      <a href="login.html">로그인/회원가입</a>
      <a href="search.html">레시피 검색</a>
      <a class="active" href="recommend.html">메뉴추천</a>
      <a href="ingredients.html">재료관리</a>
      <a href="settings.html">설정</a>
    </nav>
  </header>

  <main class="page">
    <section class="panel">
      <p class="eyebrow">메뉴추천</p>
      <h1 style="font-size:2.4rem;">추천 레시피</h1>
      <div class="inline-between" style="margin-bottom:14px;">
        <p style="margin:0; color:#5b6655;">예산기반 추천 + 메뉴검색 흐름을 반영했습니다.</p>
        <div class="inline-between" style="gap:8px;">
          <label for="budgetFilter" style="margin:0;">예산 상한</label>
          <select id="budgetFilter">
            <option value="12000">12,000원 이하</option>
            <option value="10000" selected>10,000원 이하</option>
            <option value="7000">7,000원 이하</option>
            <option value="5000">5,000원 이하</option>
          </select>
        </div>
      </div>
      <div class="inline-between" style="margin-bottom:14px; justify-content:flex-start;">
        <button class="btn primary" id="recommendAiBtn" type="button">AI 추천 받기</button>
      </div>
      <div class="form-grid" style="margin-bottom:14px;">
        <div>
          <label for="aiMenuPrompt">AI에게 메뉴 추천 질문</label>
          <textarea id="aiMenuPrompt" rows="3" placeholder="예: 매콤하고 든든한 저녁 메뉴 추천해줘"></textarea>
        </div>
        <button class="btn" id="askAiMenuBtn" type="button">AI 메뉴 추천 받기</button>
      </div>
      <div id="recommendAiResult" class="ai-result" style="margin-bottom:14px;" aria-live="polite">
        <p class="notice">예산 상한을 선택한 뒤 AI 추천 받기 버튼을 누르면 답변이 생성 완료 후 표시됩니다.</p>
      </div>
      <p id="recommendAiMeta" style="margin:0; color:#5a6455; font-size:0.9rem;">응답 대기 중</p>
      <div id="recommendList" class="card-grid"></div>
    </section>

    <section class="panel">
      <h2>다음 단계</h2>
      <div class="sitemap-grid" style="grid-template-columns:repeat(2, minmax(0,1fr));">
        <a class="map-card" href="recipe.html">
          <strong>레시피 상세</strong>
          <span>조리방법 · 예상 비용 · 대체 재료 확인</span>
        </a>
        <a class="map-card" href="ingredients.html">
          <strong>재료관리</strong>
          <span>재료 등록 후 보유 재료 기반 추천 정확도 향상</span>
        </a>
      </div>
    </section>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
