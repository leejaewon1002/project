<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Fit | 레시피 검색</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon">🥬</span><span>Meal Fit</span></a>
    <nav class="nav">
      <a href="login.html">로그인/회원가입</a>
      <a class="active" href="search.html">레시피 검색</a>
      <a href="recommend.html">메뉴추천</a>
      <a href="ingredients.html">재료관리</a>
      <a href="settings.html">설정</a>
    </nav>
  </header>

  <main class="page">
    <section class="panel">
      <p class="eyebrow">레시피 검색</p>
      <h1 style="font-size:2.4rem;">음식 + 예산 맞춤 검색</h1>
      <div class="form-grid" id="searchArea">
        <div>
          <label for="foodName">먹고 싶은 음식</label>
          <input id="foodName" type="text" placeholder="예: 김치찌개, 제육볶음" />
        </div>
        <div class="row">
          <div>
            <label for="minBudget">최소 금액</label>
            <input id="minBudget" type="number" value="0" min="0" step="100" />
          </div>
          <div>
            <label for="maxBudget">최대 금액</label>
            <input id="maxBudget" type="number" value="10000" min="1000" step="100" />
          </div>
        </div>

        <div>
          <label>카테고리</label>
          <div class="chips" id="categoryChips">
            <button class="chip active" data-category="전체" type="button">전체</button>
            <button class="chip" data-category="초저가" type="button">초저가</button>
            <button class="chip" data-category="간편요리" type="button">간편요리</button>
            <button class="chip" data-category="건강식" type="button">건강식</button>
          </div>
        </div>

        <div class="inline-between">
          <label>보유 재료 최적화 추천</label>
          <input id="ownedToggle" class="toggle" type="checkbox" checked />
        </div>

        <button class="btn primary" id="searchBtn" type="button">레시피검색</button>
      </div>
    </section>

    <section class="panel">
      <h2>AI 검색 답변</h2>
      <div id="searchAiResult" class="ai-result" aria-live="polite">
        <p class="notice">검색 조건을 입력하고 레시피 검색 버튼을 누르면 AI 답변이 표시됩니다.</p>
      </div>
      <p id="searchAiMeta" style="margin:8px 0 0; color:#5a6455; font-size:0.9rem;">응답 대기 중</p>
    </section>

    <section class="panel">
      <h2>검색 결과</h2>
      <div id="searchResult" class="card-grid"></div>
    </section>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
