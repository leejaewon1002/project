version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mealfit-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealfit-backend
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/mealfit
      - JWT_SECRET=change_me
      - NODE_ENV=development
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app

volumes:
  mongo_data:
